
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="stopwatch-card">

            <h1>STOPWATCH</h1>
            <p class="subtitle">Track Every Second</p>

            <div class="timer" id="display">
                00:00:00
            </div>

            <div class="milliseconds" id="milliseconds">
                00
            </div>

            <div class="buttons">
                <button id="startBtn" class="start">Start</button>
                <button id="pauseBtn" class="pause">Pause</button>
                <button id="resetBtn" class="reset">Reset</button>
                <button id="lapBtn" class="lap">Lap</button>
            </div>

            <div class="lap-section">
                <h2>Lap Times</h2>
                <ul id="lapList">
                    <li class="empty">No laps recorded yet</li>
                </ul>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
